<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Overpass API Result</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
    <style>
        body { font-family: system-ui, sans-serif; margin: 2rem; background: #f7f7f8; }
        h1 { font-size: 1.5rem; }
        #status { color: #555; }
        #output { white-space: pre-wrap; overflow-wrap: anywhere; padding: 1rem; border-radius: .5rem; background: #fff; border: 1px solid #ddd; }
        .error { color: #b42318; border-color: #fecdca; background: #fff5f4; }
        button { padding: .65rem 1rem; margin: 0 0 1rem; cursor: pointer; }
        .map-layout { display: grid; grid-template-columns: minmax(280px, 360px) 1fr; height: 580px; margin: 1rem 0; border: 1px solid #ddd; border-radius: .5rem; overflow: hidden; }
        .results-panel { overflow-y: auto; padding: 1rem; background: #fff; border-right: 1px solid #ddd; }
        .results-panel h2 { margin-bottom: .75rem; font-size: 1.15rem; }
        #hospitals { padding-left: 1.25rem; }
        #hospitals li { margin: .6rem 0; cursor: pointer; }
        #route-info { margin: .75rem 0; font-weight: 600; color: #0f5132; }
        #map { height: 100%; min-width: 0; }
        @media (max-width: 700px) { .map-layout { grid-template-columns: 1fr; grid-template-rows: 220px 360px; height: 580px; } .results-panel { grid-row: 2; border-right: 0; border-top: 1px solid #ddd; } #map { grid-row: 1; } }
        /* Essential Leaflet layout styles, kept locally so map tiles stay inside #map. */
        .leaflet-container { position: relative; overflow: hidden; background: #d9edf7; outline: 0; }
        .leaflet-pane, .leaflet-tile, .leaflet-marker-icon, .leaflet-marker-shadow { position: absolute; left: 0; top: 0; }
        .leaflet-pane { z-index: 400; }
        .leaflet-tile-pane { z-index: 200; }
        .leaflet-overlay-pane { z-index: 400; }
        .leaflet-marker-pane { z-index: 600; }
        .leaflet-popup-pane { z-index: 700; cursor: auto; }
        .leaflet-tile { visibility: inherit; max-width: none !important; max-height: none !important; }
        .leaflet-container svg { max-width: none !important; max-height: none !important; }
        .leaflet-zoom-animated { transform-origin: 0 0; }
        .leaflet-interactive { cursor: pointer; }
        .leaflet-control { position: relative; z-index: 800; pointer-events: auto; }
        .leaflet-top, .leaflet-bottom { position: absolute; z-index: 1000; pointer-events: none; }
        .leaflet-top { top: 0; } .leaflet-right { right: 0; } .leaflet-bottom { bottom: 0; } .leaflet-left { left: 0; }
        .leaflet-control-zoom { border: 2px solid rgba(0,0,0,.2); border-radius: 4px; overflow: hidden; }
        .leaflet-control-zoom a { display: block; width: 30px; height: 30px; line-height: 30px; text-align: center; background: #fff; color: #222; text-decoration: none; font-size: 18px; }
        .leaflet-control-attribution { padding: 0 5px; font-size: 11px; background: rgba(255,255,255,.75); }
        .leaflet-popup { position: absolute; text-align: center; margin-bottom: 20px; }
        .leaflet-popup-content-wrapper { padding: 1px; text-align: left; border-radius: 8px; background: #fff; box-shadow: 0 3px 14px rgba(0,0,0,.3); }
        .leaflet-popup-content { margin: 13px 19px; line-height: 1.4; }
    </style>
</head>
<body>
    <h1>Hospitals near you</h1>
    <button id="find-hospitals" type="button">Find nearby hospitals</button>
    <p id="status">Select the button to use your current location.</p>
    <p id="route-info" aria-live="polite"></p>
    <div class="map-layout">
        <aside class="results-panel">
            <h2>Results</h2>
            <ul id="hospitals"></ul>
        </aside>
        <div id="map" aria-label="Map of nearby hospitals"></div>
    </div>
    <details>
        <summary>View API response</summary>
        <pre id="output" aria-live="polite"></pre>
    </details>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script src="map.js"></script>
</body>
</html>
